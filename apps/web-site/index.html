<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail@ - 스마트한 이메일 관리</title> <!-- 페이지 제목 -->
    <link rel="icon" type="image/svg+xml" href="brachio.png" /> <!-- 파비콘 설정 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome 아이콘 추가 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-envelope-open-text"></i> <!-- 로고 아이콘 예시 -->
        </div>
        <h1>Mail@</h1>
        <p>가장 스마트한 방법으로 이메일을 관리하세요.</p>
    </header>
    <main>
        <section id="features">
            <h2>주요 기능</h2>
            <div class="feature-list">
                <div class="feature-item">
                    <i class="fas fa-magic"></i>
                    <h3>간편한 정리</h3>
                    <p>자동 분류 및 필터링으로 받은 편지함을 깔끔하게 유지하세요.</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-shield-alt"></i>
                    <h3>강력한 보안</h3>
                    <p>최신 보안 기술로 사용자의 데이터를 안전하게 보호합니다.</p>
                </div>
                <div class="feature-item">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>모바일 최적화</h3>
                    <p>언제 어디서든 모든 기기에서 Mail@를 사용하세요.</p>
                </div>
            </div>
        </section>
        <section id="download">
            <h2>지금 바로 시작하세요</h2>
            <p>Mail@ 앱을 다운로드하고 차이를 경험해보세요.</p>
            <a href="brachio.png" class="download-button" download="brachio.png">
                <i class="fas fa-download"></i> Mail@ 다운로드
            </a>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Mail@.  All Rights Reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
